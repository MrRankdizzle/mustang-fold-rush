<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Review games for Biology Standard 1.4: Protein Structure and Function. Code it. Build it. Fold it.">
<meta name="theme-color" content="#13294B">
<meta property="og:title" content="Mustang Fold Rush">
<meta property="og:description" content="Review games for Biology Standard 1.4: Protein Structure and Function.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mustang Fold Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a rodeo "program" — a menu of corrals (levels) holding game cards; each game opens as a full working arena with a slim status bar. */
:root{
  --bg:#F2F7FB; --surface:#FFFFFF; --surface-2:#E6F0F8; --surface-3:#D6E7F4;
  --ink:#13294B; --ink-2:#4B6483; --line:#CADCEB;
  --carolina:#4B9CD3; --carolina-deep:#24679F; --sky:#A9D4F2; --sky-soft:#DCEEFB;
  --good:#23895A; --good-bg:#DDF3E7; --bad:#C8423D; --bad-bg:#FBE3E1; --warn:#B87A00; --warn-bg:#FFF1CF;
  --bA:#E2628C; --bU:#3E9E66; --bT:#2C7A51; --bG:#3474CF; --bC:#E3B021;
  --g1:#F1CF62; --g2:#9DCB7C; --g3:#93BFEA; --g4:#C7A6E2;
  --cyto:#EAF5FC; --nucleo:#D9E9F7; --memb:#4B9CD3; --ribo:#6B4F3F; --ribo-2:#C9B8A2; --trna:#D93A3A;
  --shadow:0 1px 0 rgba(19,41,75,.06),0 6px 20px rgba(19,41,75,.08);
  --radius:14px; --on-accent:#FFFFFF;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1828; --surface:#14233A; --surface-2:#1B2E49; --surface-3:#243B5C;
  --ink:#E8F1F9; --ink-2:#A3B9D1; --line:#2C4566;
  --carolina:#6DB3E4; --carolina-deep:#9FD0F3; --sky:#4C86B5; --sky-soft:#1E3654;
  --good:#5CCB92; --good-bg:#173B2C; --bad:#F07E77; --bad-bg:#45201F; --warn:#F2C25B; --warn-bg:#3E3214;
  --g1:#B89A35; --g2:#5E8F45; --g3:#4A7BAE; --g4:#7F5DA0;
  --cyto:#16304A; --nucleo:#1F3D5E; --memb:#6DB3E4; --ribo:#8C6A55; --ribo-2:#5D4A3C; --trna:#EF5A5A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --on-accent:#0D1828;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1828; --surface:#14233A; --surface-2:#1B2E49; --surface-3:#243B5C;
  --ink:#E8F1F9; --ink-2:#A3B9D1; --line:#2C4566;
  --carolina:#6DB3E4; --carolina-deep:#9FD0F3; --sky:#4C86B5; --sky-soft:#1E3654;
  --good:#5CCB92; --good-bg:#173B2C; --bad:#F07E77; --bad-bg:#45201F; --warn:#F2C25B; --warn-bg:#3E3214;
  --g1:#B89A35; --g2:#5E8F45; --g3:#4A7BAE; --g4:#7F5DA0;
  --cyto:#16304A; --nucleo:#1F3D5E; --memb:#6DB3E4; --ribo:#8C6A55; --ribo-2:#5D4A3C; --trna:#EF5A5A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --on-accent:#0D1828;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--carolina);outline-offset:2px}
input{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-block:10px 0;flex-wrap:wrap}
.wrap{position:relative}
.top-actions{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.gbar .spacer{flex:1}
@media (min-width:761px){.home-top{position:absolute;top:0;right:0;z-index:2}.hero{padding-top:18px}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;background:none;border:0;padding:0;text-align:left}
.brand svg{width:44px;height:44px;flex:none}
.brand b{font-family:var(--font-display);font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--carolina);color:var(--on-accent);box-shadow:0 2px 0 var(--carolina-deep);transition:transform .08s}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:10px 18px}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--carolina)}
.std{margin-top:12px;font-size:1.02rem;max-width:58ch;color:var(--ink-2)}
.std b{color:var(--ink)}
.namebox{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.namebox input{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0;width:240px;max-width:100%}
.dogma-strip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.dogma-strip svg{width:100%;height:auto;display:block}
.level{margin-top:26px}
.level-head{display:flex;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.lvl-badge{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.6rem;background:var(--carolina);color:var(--on-accent)}
.level-head h2{font-size:1.4rem}
.level-head p{margin:2px 0 0;color:var(--ink-2);max-width:70ch}
.level-head .lvl-prog{margin-left:auto;font-weight:700;font-size:.9rem;color:var(--ink-2);align-self:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--carolina)}
.card .ic{width:52px;height:52px;border-radius:12px;background:var(--sky-soft);display:grid;place-items:center}
.card .ic svg{width:34px;height:34px}
.card h3{font-size:1.06rem;font-weight:700}
.card p{margin:3px 0 0;font-size:.88rem;color:var(--ink-2);line-height:1.35}
.card .best{position:absolute;top:10px;right:10px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--good-bg);color:var(--good)}

/* ---------- game shell ---------- */
.gbar{display:flex;align-items:center;gap:10px;padding-block:16px 10px;flex-wrap:wrap}
.gbar h1{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:800}
.gbar .lvl{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--carolina-deep);background:var(--sky-soft);border-radius:999px;padding:3px 10px}
.howto{margin:0 0 14px;color:var(--ink-2);max-width:80ch}
.arena{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.stat{background:var(--surface-2);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-weight:400;margin-right:4px}
.feedback{min-height:1.6em;font-weight:700;margin:10px 0}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.panel{background:var(--surface-2);border-radius:12px;padding:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--carolina);color:var(--on-accent)}
.done-card{text-align:center;padding:26px 12px}
.done-card h2{font-size:1.8rem;margin-bottom:6px}
.done-card .big{font-family:var(--font-display);font-size:3rem;font-weight:800;color:var(--carolina)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* base tiles */
.base{display:inline-grid;place-items:center;width:34px;height:38px;border-radius:8px;font-family:var(--font-mono);font-weight:700;color:#fff;font-size:1.05rem}
.base.A{background:var(--bA)} .base.U{background:var(--bU)} .base.T{background:var(--bT)} .base.G{background:var(--bG)} .base.C{background:var(--bC);color:#13294B}
.base.empty{background:var(--surface);border:2px dashed var(--line);color:var(--ink-2)}
.base.cur{border-color:var(--carolina);box-shadow:0 0 0 3px var(--sky)}
.base.wrong{background:var(--bad)!important}

/* chips + drag */
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;touch-action:none;user-select:none;cursor:grab;line-height:1.2}
.chip.sel{border-color:var(--carolina);box-shadow:0 0 0 3px var(--sky)}
.chip.placed{cursor:pointer}
.chip.ok{border-color:var(--good);background:var(--good-bg)}
.chip.no{border-color:var(--bad);background:var(--bad-bg)}
.chip.used{opacity:.35;pointer-events:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:var(--shadow)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;background:var(--surface-2);min-height:56px}
.drop-hot{outline:3px dashed var(--carolina)!important;outline-offset:2px}

/* label diagrams */
.diagram{position:relative;width:100%;margin:0 auto}
.diagram>svg{display:block;width:100%;height:auto}
.dz{position:absolute;transform:translate(-50%,-50%);min-width:96px;min-height:34px;border:2px dashed var(--carolina);border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:700;padding:2px 6px;text-align:center;color:var(--ink-2);line-height:1.15}
.dz .chip{padding:4px 8px;font-size:.78rem;border-width:2px}
.dz.filled{border-style:solid;background:var(--surface)}
.dz.ok{border-color:var(--good);background:var(--good-bg)}
.dz.no{border-color:var(--bad);background:var(--bad-bg)}
.dz-num{position:absolute;top:-10px;left:-10px;width:20px;height:20px;border-radius:50%;background:var(--carolina);color:var(--on-accent);font-size:.7rem;display:grid;place-items:center}
@media (max-width:640px){.dz{min-width:64px;font-size:.66rem;min-height:26px}.dz .chip{font-size:.62rem;padding:2px 4px}}

/* keyboard */
.kb{display:grid;gap:6px;margin-top:12px;max-width:560px;margin-inline:auto}
.kb .kr{display:flex;gap:5px;justify-content:center}
.kb button{flex:1;max-width:44px;height:48px;border:0;border-radius:8px;background:var(--surface-3);font-weight:700;font-size:.95rem;padding:0}
.kb button.wide{max-width:72px;font-size:.78rem}
.kb button.g{background:var(--good);color:#fff}.kb button.y{background:var(--warn);color:#fff}.kb button.x{background:var(--ink-2);color:var(--bg);opacity:.55}

/* wordle */
.wgrid{display:grid;gap:6px;justify-content:center;margin:6px auto}
.wrow{display:flex;gap:6px;justify-content:center}
.wcell{width:clamp(30px,8.6vw,50px);height:clamp(34px,9.6vw,54px);border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:clamp(1rem,3.6vw,1.5rem);text-transform:uppercase;background:var(--surface)}
.wcell.f{border-color:var(--ink-2)}
.wcell.g{background:var(--good);border-color:var(--good);color:#fff}
.wcell.y{background:var(--warn);border-color:var(--warn);color:#fff}
.wcell.x{background:var(--ink-2);border-color:var(--ink-2);color:var(--bg)}
.wcell.flip{animation:flip .45s both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}

/* connections */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ctile{min-height:70px;border:0;border-radius:10px;background:var(--surface-3);font-weight:700;font-size:clamp(.72rem,2.2vw,.98rem);padding:6px;line-height:1.15;word-break:break-word;transition:transform .1s}
.ctile.sel{background:var(--ink);color:var(--bg)}
.cfound{grid-column:1/-1;border-radius:10px;padding:10px 12px;text-align:center;color:#13294B}
.cfound b{display:block;font-family:var(--font-display);font-size:1.05rem}
.cfound span{font-size:.85rem}
.dots{display:inline-flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--ink-2);display:inline-block}
.dots i.off{opacity:.18}

/* crossword */
.xw{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:18px;align-items:start}
.xgrid-wrap{overflow:auto;max-width:100%}
.xgrid{display:grid;gap:2px;width:max-content}
.xc{width:clamp(22px,5.4vw,34px);height:clamp(22px,5.4vw,34px);position:relative}
.xc.on{background:var(--surface);border:1.5px solid var(--ink-2);border-radius:4px}
.xc input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:700;font-size:clamp(.75rem,2.6vw,1.05rem);text-transform:uppercase;padding:0;caret-color:transparent}
.xc.hl{background:var(--sky-soft)} .xc.cur{background:var(--sky)}
.xc.ok{background:var(--good-bg)} .xc.no{background:var(--bad-bg)}
.xc sup{position:absolute;top:0;left:2px;font-size:.55rem;color:var(--ink-2);pointer-events:none}
.clues{min-width:0}
.clues h3{font-size:1rem;margin:4px 0 6px}
.clues ol{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:4px}
.clues li{padding:5px 8px;border-radius:8px;cursor:pointer;font-size:.92rem}
.clues li.act{background:var(--sky-soft)}
.clues li.solved{color:var(--good);text-decoration:line-through}
@media (max-width:760px){.xw{grid-template-columns:minmax(0,1fr)}}

/* hangman egg */
.egg-wrap svg{width:100%;height:auto;display:block}
.egg-wrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:640px){.egg-wrap{grid-template-columns:minmax(0,1fr)}.egg-wrap svg{max-width:220px;margin:0 auto}}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.slot{width:30px;height:40px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.3rem}
.slot.space{border:0;width:16px}
.letters{display:flex;flex-wrap:wrap;gap:5px}
.letters button{width:38px;height:42px;border:0;border-radius:8px;background:var(--surface-3);font-weight:700}
.letters button.hit{background:var(--good);color:#fff}.letters button.miss{background:var(--bad);color:#fff;opacity:.6}

/* acrostic */
.acro{display:grid;gap:5px;overflow-x:auto;padding-bottom:6px}
.arow{display:flex;gap:3px;align-items:center}
.acell{width:30px;height:32px;flex:none}
.acell input{width:100%;height:100%;border:1.5px solid var(--ink-2);border-radius:5px;text-align:center;font-weight:700;text-transform:uppercase;background:var(--surface);padding:0}
.acell.key input{background:var(--g1);border-color:var(--warn);color:#13294B}
.acell.ok input{background:var(--good-bg);border-color:var(--good)}
.acell.no input{background:var(--bad-bg);border-color:var(--bad)}
.aclue{font-size:.86rem;color:var(--ink-2);margin-left:10px;min-width:220px}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:620px}
.bcell{aspect-ratio:1/1;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:clamp(.6rem,1.9vw,.86rem);line-height:1.1;padding:4px;display:grid;place-items:center;word-break:break-word;position:relative;max-width:100%}
.bcell.mark{background:var(--carolina);color:var(--on-accent);border-color:var(--carolina-deep)}
.bcell.free{background:#FFFFFF;color:#13294B;border-color:var(--line)}
.bcell.win{background:var(--good);border-color:var(--good)}
.caller{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;font-size:1.05rem;min-height:84px;display:flex;align-items:center}

/* sortable */
.sortlist{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.sortitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;touch-action:none;user-select:none}
.sortitem .grip{cursor:grab;color:var(--ink-2);flex:none}
.sortitem .num{width:28px;height:28px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;font-weight:700;flex:none}
.sortitem .txt{flex:1;min-width:0}
.sortitem .mv{display:flex;flex-direction:column;gap:2px}
.sortitem .mv button{border:0;background:var(--surface-2);border-radius:6px;width:30px;height:22px;padding:0;display:grid;place-items:center}
.sortitem.ok{border-color:var(--good);background:var(--good-bg)} .sortitem.no{border-color:var(--bad);background:var(--bad-bg)}
.sortitem.dragging{opacity:.4}

/* bins */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:120px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.bin h4{font-size:1rem;text-align:center;margin-bottom:4px}
.bin .chip{font-size:.82rem;cursor:default}
.deck{display:flex;justify-content:center;margin:8px 0}
.deck .chip{font-size:1.05rem;padding:14px 18px;max-width:520px;text-align:center;justify-content:center;background:var(--surface);box-shadow:var(--shadow)}

/* codon wheel builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.builder{grid-template-columns:minmax(0,1fr)}}
.wheel svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.wheel .wg{cursor:pointer;transition:opacity .15s}
.wheel .wg:hover path{filter:brightness(1.08)}
.wheel.stepping .wg.dim{opacity:.25}
.strand{display:flex;gap:2px;overflow-x:auto;padding:8px 2px;scroll-behavior:smooth}
.strand .base{width:26px;height:32px;font-size:.9rem;flex:none;border-radius:6px;cursor:pointer}
.strand .gap{width:8px;flex:none}
.strand .base.in{outline:3px solid var(--ink);outline-offset:1px}
.strand .base.past{opacity:.35}
.strand .base.lead{opacity:.6}

/* fold lab */
.fold{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.fold{grid-template-columns:minmax(0,1fr)}}
.fold svg{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:14px}
input[type=range]{width:100%;accent-color:var(--carolina)}
.lvltabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.lvltabs button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.lvltabs button[aria-pressed="true"]{border-color:var(--carolina);background:var(--sky-soft)}
.facts{display:grid;gap:8px}
.facts div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.92rem}
.facts b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* quiz */
.qcard{max-width:760px;margin:0 auto}
.qcard h3{font-size:1.25rem;margin-bottom:12px;font-family:var(--font-body);font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover{border-color:var(--carolina)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.no{border-color:var(--bad);background:var(--bad-bg)}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pic{border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px}
.pic svg{width:100%;height:auto;display:block}
.pic.ok{border-color:var(--good)} .pic.no{border-color:var(--bad)}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;margin-bottom:8px}
.matchrow .slotbox{min-height:44px;border:2px dashed var(--line);border-radius:10px;padding:4px;display:flex;align-items:center}
.matchrow .who{font-weight:700;display:flex;gap:8px;align-items:center}

/* enigma */
.rotor{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.rotor span{width:44px;height:56px;border-radius:8px;background:var(--ink);color:var(--g1);font-family:var(--font-mono);font-weight:700;font-size:1.6rem;display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.codon-table{border-collapse:collapse;font-family:var(--font-mono);font-size:.78rem;width:100%;min-width:520px}
.codon-table th{background:var(--surface-3);padding:4px}
.codon-table td{border:1px solid var(--line);padding:0}
.codon-table td button{display:block;width:100%;border:0;background:var(--surface);padding:4px 2px;font-family:var(--font-mono);font-size:.76rem;text-align:left;white-space:nowrap}
.codon-table td button:hover{background:var(--sky-soft)}
.codon-table td button b{color:var(--carolina-deep)}
.codon-table td button.hit{background:var(--good-bg)}
.codon-table td button.miss{background:var(--bad-bg)}
.tbl-wrap{overflow-x:auto}
.inline-in{border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);width:100%;font-family:var(--font-mono);text-transform:uppercase}

/* dash */
.dash{position:relative;height:420px;border-radius:16px;overflow:hidden;background:linear-gradient(var(--sky-soft),var(--surface-2));touch-action:manipulation}
.dash .faller{position:absolute;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;font-size:1.05rem;white-space:nowrap;box-shadow:var(--shadow)}
.dash .floor{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--bad);opacity:.5}
.stations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stations button{border:0;border-radius:14px;padding:14px 6px;font-family:var(--font-display);font-weight:800;font-size:1.1rem;color:#fff;display:grid;gap:2px;justify-items:center}
.stations button small{font-family:var(--font-body);font-weight:400;font-size:.72rem;opacity:.9}
.hearts{display:inline-flex;gap:4px}
.hearts svg{width:20px;height:20px}

/* pin the tail */
.pin-stage{position:relative;border-radius:16px;overflow:hidden;background:var(--cyto);user-select:none}
.pin-stage svg{display:block;width:100%;height:auto}
.pin-stage.target{cursor:crosshair}
.pin-stage.field{background:#DCEEFB}
.pin-prompt{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:1.08rem;font-weight:700}
.pin-prompt .n{font-family:var(--font-display);font-size:1.6rem;color:var(--g1);flex:none}
.blind svg.cellsvg{animation:dizzy 7s ease-in-out infinite;filter:blur(.6px)}
@keyframes dizzy{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(3deg) scale(1.03) translate(8px,-4px)}50%{transform:rotate(-2deg) scale(.99) translate(-6px,6px)}75%{transform:rotate(2deg) scale(1.02) translate(4px,4px)}}
.zoomer{transition:transform 1.6s cubic-bezier(.6,0,.3,1),opacity 1.2s ease 0.6s}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* evidence */
.ev-table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.ev-table th,.ev-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.ev-table th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.bar{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--carolina)}

@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= LEVEL 1 · animated vocab games ================= */
/* egg scene */
.eggscene{width:100%;height:auto;display:block;border-radius:16px;overflow:visible}
.eggscene .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.eggscene .flame:nth-child(2n){animation-duration:.38s;animation-delay:-.2s}
.eggscene .flame:nth-child(3n){animation-duration:.62s;animation-delay:-.1s}
@keyframes flick{0%{transform:scaleY(.86) skewX(-3deg)}100%{transform:scaleY(1.12) skewX(3deg)}}
.eggscene #flames{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.eggscene #flames.flare{animation:flare .5s}
@keyframes flare{40%{filter:brightness(1.5)}}
.eggscene #pan.jolt{animation:jolt .45s}
@keyframes jolt{20%{transform:translate(-7px,1px) rotate(-1.5deg)}45%{transform:translate(6px,-1px) rotate(1deg)}70%{transform:translate(-3px,0)}}
.eggscene #yolk{transform-box:fill-box;transform-origin:50% 90%}
.eggscene #yolk.hop{animation:hop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{0%{transform:scale(1)}20%{transform:scale(1.18,.82)}50%{transform:translateY(-16px) scale(.9,1.12)}75%{transform:scale(1.06,.94)}100%{transform:scale(1)}}
.eggscene #yolk.cheer{animation:hop .6s cubic-bezier(.3,1.5,.5,1) 3}
.eggscene #yolk.wilt{animation:wilt .8s forwards}
@keyframes wilt{to{transform:scale(1.15,.7)}}
.eggscene .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.eggscene .bub{transform-box:fill-box;transform-origin:center;animation:bub 1.1s ease-in infinite}
@keyframes bub{0%{transform:scale(0);opacity:0}30%{opacity:.9}80%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.eggscene .steam{animation:steam 2.6s ease-in infinite}
.eggscene .steam:nth-child(2){animation-delay:-.9s}.eggscene .steam:nth-child(3){animation-delay:-1.7s}
@keyframes steam{0%{transform:translateY(10px);opacity:0}30%{opacity:.7}100%{transform:translateY(-46px);opacity:0}}
.eggscene .sweat{animation:sweat 1.4s ease-in infinite}
@keyframes sweat{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.eggscene .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
.eggscene .spark:nth-child(2n){animation-delay:-.5s}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.eggscene .smoke{animation:smoke 3s ease-out infinite}
.eggscene .smoke:nth-child(2){animation-delay:-1s}.eggscene .smoke:nth-child(3){animation-delay:-2s}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.55}100%{transform:translateY(-70px) scale(1.6);opacity:0}}
.eggscene #white,.eggscene #merc,.eggscene #crisp{transition:all .7s ease}
.egg-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:760px){.egg-layout{grid-template-columns:minmax(0,1fr)}}
.clue-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:1.05rem}
.clue-card .tag{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 7px;margin-top:3px}
.slot.flip-in{animation:slotIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes slotIn{0%{transform:rotateX(90deg) translateY(-8px);color:var(--good)}100%{transform:none}}
.slot.lost{color:var(--bad)}
.letters button.hit{animation:pop .3s}
.letters button.miss{animation:shake .35s}
.eggtally{display:inline-flex;gap:4px;align-items:center}
.eggtally svg{width:22px;height:22px}

/* crossword life */
.xc.on{animation:cellIn .45s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0ms)}
@keyframes cellIn{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.xc.on.typed input{animation:pop .22s}
.xc.on.wave{animation:wave .6s ease both;animation-delay:var(--w,0ms)}
@keyframes wave{0%{transform:none}35%{transform:translateY(-9px) scale(1.12);background:var(--good);}100%{transform:none}}
.xc.on.solved{background:var(--good-bg);border-color:var(--good)}
.xc.on.cascade{animation:cascade .7s ease both;animation-delay:var(--w,0ms)}
@keyframes cascade{0%{transform:rotateY(0)}50%{transform:rotateY(90deg);background:var(--carolina)}100%{transform:rotateY(0);background:var(--good-bg)}}
.xc.on.no{animation:shake .35s}
.xc{transition:background .2s}
.ck{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:4px;flex:none}
.clues li.solved{text-decoration:none;color:var(--good)}
.clues li.solved .ck path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.xprog{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:4px 0 12px}
.xprog i{display:block;height:100%;background:linear-gradient(90deg,var(--carolina),var(--good));transition:width .6s cubic-bezier(.3,1.4,.5,1)}

/* acrostic life */
.banner{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px}
.banner span{width:46px;height:56px;border-radius:10px;background:var(--ink);color:var(--g1);font-family:var(--font-display);font-weight:800;font-size:1.7rem;display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transform-style:preserve-3d}
.banner span.got{animation:flipShow .6s ease both}
@keyframes flipShow{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.banner.done span{animation:bannerDance .8s ease both;animation-delay:var(--d,0ms);background:var(--carolina);color:#FFFFFF}
@keyframes bannerDance{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(2px) rotate(3deg)}}
.arow{animation:rowIn .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0ms);border-radius:10px;padding:3px 6px;transition:background .2s}
@keyframes rowIn{0%{transform:translateX(-40px);opacity:0}100%{transform:none;opacity:1}}
.arow.focus{background:var(--sky-soft)}
.arow.locked .acell input{background:var(--good-bg);border-color:var(--good)}
.arow.locked .acell.key input{background:var(--g1);border-color:var(--warn);box-shadow:0 0 0 3px var(--good)}
.arow.locked .acell{animation:wave .55s ease both;animation-delay:var(--w,0ms)}
.arow.bad{animation:shake .4s}
.flyer{position:fixed;z-index:90;pointer-events:none;width:30px;height:32px;border-radius:6px;background:var(--g1);color:#13294B;font-weight:800;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* define-it scenes */
.scene{border-radius:14px;background:var(--surface-2);overflow:hidden;position:relative;transition:filter .6s,opacity .6s}
.scene svg{display:block;width:100%;height:auto}
.scene:not(.live){filter:grayscale(1);opacity:.5}
.scene:not(.live) *{animation-play-state:paused!important}
.scene .tagline{position:absolute;left:10px;top:8px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.scene.live .tagline{color:var(--good)}
.bk{transition:background .3s}
.bk.ok-glow{background:var(--good-bg);border-radius:8px}
.sdots{display:flex;gap:6px}
.sdots i{width:22px;height:8px;border-radius:4px;background:var(--surface-3)}
.sdots i.on{background:var(--good)} .sdots i.cur{background:var(--carolina)}
.scn-slide{animation:scnSlide 3.2s ease-in-out infinite}
@keyframes scnSlide{0%,10%{transform:translateX(0)}80%,100%{transform:translateX(110px)}}
.scn-grow{stroke-dasharray:130;animation:scnGrow 3.2s ease-in-out infinite}
@keyframes scnGrow{0%,10%{stroke-dashoffset:130}80%,100%{stroke-dashoffset:0}}
.scn-exit{stroke-dasharray:8 6;animation:scnExit 1s linear infinite}
@keyframes scnExit{to{stroke-dashoffset:-28}}
.scn-ribo{animation:scnRibo 4s steps(1) infinite}
@keyframes scnRibo{0%{transform:translateX(0)}25%{transform:translateX(66px)}50%{transform:translateX(132px)}75%{transform:translateX(198px)}}
.scn-bead{opacity:0;animation:scnBead 4s steps(1) infinite}
@keyframes scnBead{0%{opacity:0}100%{opacity:1}}
.scn-pulse{transform-box:fill-box;transform-origin:center;animation:scnPulse 3s ease-in-out infinite}
@keyframes scnPulse{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
.scn-dot{animation:scnDot 3s linear infinite}
@keyframes scnDot{0%{transform:translateX(0);opacity:0}5%{opacity:1}45%{transform:translateX(130px);opacity:1}50%{transform:translateX(130px);opacity:0}55%{transform:translateX(150px);opacity:1}95%{transform:translateX(280px);opacity:1}100%{transform:translateX(280px);opacity:0}}
.scn-cover{transform-box:fill-box;transform-origin:0 50%;animation:scnCover 4.5s ease-in-out infinite}
@keyframes scnCover{0%,8%{transform:scaleX(1)}22%,90%{transform:scaleX(.04)}100%{transform:scaleX(1)}}
.scn-card{animation:scnCard 4.5s ease-in-out infinite}
@keyframes scnCard{0%,20%{transform:translate(0,0) scale(.6);opacity:0}28%{transform:translate(10px,-10px) scale(1);opacity:1}48%{transform:translate(118px,-24px) scale(1);opacity:1}56%,100%{transform:translate(150px,10px) scale(.3);opacity:0}}
.scn-meal{transform-box:fill-box;transform-origin:center;animation:scnMeal 4.5s ease-in-out infinite}
@keyframes scnMeal{0%,55%{transform:scale(0);opacity:0}70%{transform:scale(1.15);opacity:1}80%,100%{transform:scale(1);opacity:1}}
.scn-chef{transform-box:fill-box;transform-origin:50% 100%;animation:scnChef 4.5s ease-in-out infinite}
@keyframes scnChef{0%,48%,100%{transform:none}52%{transform:translateY(-6px) rotate(-4deg)}56%{transform:translateY(-6px) rotate(4deg)}60%{transform:none}}
.scn-in-l{animation:scnInL 4s ease-out infinite}
@keyframes scnInL{0%{transform:translateX(-260px)}25%,100%{transform:none}}
.scn-in-t{animation:scnInT 4s ease-out infinite}
@keyframes scnInT{0%,20%{transform:translateY(-90px)}45%,100%{transform:none}}
.scn-in-b{animation:scnInB 4s ease-out infinite}
@keyframes scnInB{0%,20%{transform:translateY(90px)}45%,100%{transform:none}}
.scn-drop{animation:scnDrop 4s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes scnDrop{0%,50%{transform:translateY(-120px);opacity:0}70%,100%{transform:none;opacity:1}}
.scn-fade{opacity:0;animation:scnFade 4s ease infinite}
@keyframes scnFade{0%,72%{opacity:0}85%,100%{opacity:1}}
.scn-hop{animation:scnHop 4s steps(1) infinite}
@keyframes scnHop{0%{transform:translateX(0)}25%{transform:translateX(78px)}50%{transform:translateX(156px)}75%{transform:translateX(234px)}}

.caption-bar{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:700;font-size:1.02rem;min-height:3.2em;line-height:1.35}
.caption-bar .cap-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--g1);color:#13294B;display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.caption-bar b{color:var(--g1)}
.caption-bar .mono{background:rgba(255,255,255,.14);border-radius:4px;padding:0 4px}
.caption-bar.cap-in{animation:capIn .35s ease}
@keyframes capIn{0%{opacity:.3;transform:translateY(4px)}100%{opacity:1;transform:none}}

/* animated title */
.title-logo{margin:0;line-height:1}
.title-logo svg{display:block;width:100%;max-width:600px;height:auto;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
.subtitle{font-family:var(--font-display);font-weight:700;font-size:clamp(1.05rem,2vw,1.35rem);letter-spacing:-.01em;margin:10px 0 0;color:var(--ink-2)}
.subtitle em{font-style:normal;color:var(--carolina)}
.fr-rush{transform-box:fill-box;transform-origin:0 100%;animation:rushIn .85s cubic-bezier(.2,1.25,.4,1) 1.25s both}
@keyframes rushIn{0%{transform:translateX(120px) skewX(-28deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
.fr-tw{transform-box:fill-box;transform-origin:center;opacity:0;animation:frTw 2.4s ease-in-out infinite}
@keyframes frTw{0%,100%{transform:scale(.15) rotate(0);opacity:0}45%,55%{transform:scale(1) rotate(45deg);opacity:1}}

/* builder: mRNA track with tRNA docking */
.track-wrap{overflow-x:auto;background:var(--surface-2);border-radius:14px;padding:8px 4px;scroll-behavior:smooth}
.track-wrap .strand.attn{border-radius:10px;animation:attn 1.6s ease-in-out infinite}
@keyframes attn{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--carolina)}}
.tk{display:flex;align-items:flex-end;width:max-content;padding:0 10px}
.tk-lead{display:flex;gap:2px;margin-right:14px;opacity:.45;padding-bottom:3px}
.tk .base{width:28px;height:34px;font-size:.95rem;border-radius:6px}
.tk-col{width:96px;flex:none;display:flex;flex-direction:column;align-items:center}
.tk-chain{height:42px;width:100%;position:relative;display:grid;place-items:center}
.tk-chain.linked::before{content:"";position:absolute;right:50%;width:96px;top:50%;height:4px;margin-top:-2px;background:var(--ink)}
.tk-chain .bead{position:relative;z-index:1}
.tk-chain .bead.bead-pop{animation:beadPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes beadPop{0%{transform:translateY(60px) scale(.5)}100%{transform:none}}
.tk-dock{height:100px;width:92px;display:flex;align-items:flex-end;justify-content:center}
.tk-dock.cur{border:2.5px dashed var(--carolina);border-radius:12px;background:var(--sky-soft);font-size:.74rem;font-weight:700;color:var(--ink-2);text-align:center;align-items:center;padding:6px;line-height:1.2;cursor:pointer;margin-bottom:2px}
.tk-dock.hot{background:var(--good-bg);border-color:var(--good);border-style:solid}
.tk-dock svg{display:block}
.tk-codon{display:flex;gap:2px;padding:3px;border-radius:8px}
.tk-col.cur .tk-codon{box-shadow:0 0 0 3px var(--ink)}
.tk-col.done .tk-codon .base{filter:saturate(.35) brightness(1.08)}
.dock-in{animation:dockIn .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes dockIn{0%{transform:translateY(-40px) scale(1.15);opacity:.4}100%{transform:none;opacity:1}}
.trna-leave{animation:trnaLeave .45s ease forwards}
@keyframes trnaLeave{to{transform:translate(-50px,-36px) rotate(-14deg);opacity:0}}
.drag-trna{position:fixed;z-index:85;pointer-events:none;transform:translate(-50%,-75%);filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.wheel-wrap{position:relative}

.wheel .wg.dim{opacity:.22}
.wheel-lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.05rem;color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:50%;cursor:not-allowed;max-width:520px;margin:0 auto}
.bob{animation:bob 1s ease-in-out infinite;display:block;margin:0 auto 6px}

/* structure check picture cards */
.chip.pic-chip{padding:4px;width:132px;justify-content:center;background:var(--surface)}
.chip.pic-chip svg{width:122px;height:76px;display:block;pointer-events:none}

/* Mustang logo + name */
.title-row{display:flex;align-items:center;gap:clamp(10px,2vw,20px)}
.title-mustang{flex:none;width:clamp(78px,13vw,138px);height:auto;transform-origin:50% 90%;animation:rear 1.1s cubic-bezier(.3,1.4,.5,1) .1s both}
@keyframes rear{0%{transform:rotate(-14deg) translateY(10px) scale(.85);opacity:0}60%{transform:rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
.title-text{min-width:0;flex:1}
.title-eyebrow{display:block;font-family:var(--font-display);font-weight:800;font-size:clamp(.85rem,1.6vw,1.1rem);letter-spacing:.42em;text-transform:uppercase;color:var(--carolina-deep);margin:0 0 4px 2px}
/* ribosome riding the mRNA in the builder */
.tk-stage{position:relative;width:max-content;min-width:100%}
.tk{position:relative;z-index:1}
.tk-dock{height:112px}
.tk-dock.cur{background:color-mix(in srgb,var(--sky-soft) 72%,transparent)}
.ribo-layer{position:absolute;width:288px;z-index:0;pointer-events:none}
.ribo-L{position:absolute;left:0;right:0;top:0;background:var(--ribo);border-radius:120px 120px 14px 14px}
.ribo-L span{position:absolute;bottom:0;top:16px;width:84px;background:var(--ribo-2);border-radius:42px 42px 0 0}
.ribo-L span:nth-child(1){left:6px}.ribo-L span:nth-child(2){left:102px}.ribo-L span:nth-child(3){left:198px}
.ribo-S{position:absolute;left:-4px;right:-4px;bottom:0;height:40px;background:var(--ribo);border-radius:18px}
.tk-col .tk-codon{position:relative;z-index:2}
.tk{padding-bottom:26px}

/* home header layout */
.hero2{padding-block:18px 8px}
.title-text{flex:0 1 600px}
.title-text .subtitle{text-align:center;margin-top:8px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start;margin-top:18px}
.hero-std .std{margin-top:0}
.hero-grid .dogma-strip{max-width:560px}
@media (max-width:860px){.hero-grid{grid-template-columns:minmax(0,1fr)}}

/* "spot the clue" guide for folding interactions */
.gguide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 12px}
@media (max-width:680px){.gguide{grid-template-columns:minmax(0,1fr)}}
.gcard{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px;font-size:.9rem;line-height:1.35}
.gcard svg{width:140px;height:auto;background:var(--surface);border-radius:10px}
.gcard .gname{display:block;font-family:var(--font-display);font-size:1rem;margin-bottom:2px}
.gc-plus{color:#E04646}.gc-minus{color:#3474CF}
.gc-ion-l{animation:gcL 2.4s ease-in-out infinite}.gc-ion-r{animation:gcR 2.4s ease-in-out infinite}
@keyframes gcL{0%,15%{transform:translateX(-14px)}55%,85%{transform:translateX(12px)}100%{transform:translateX(-14px)}}
@keyframes gcR{0%,15%{transform:translateX(14px)}55%,85%{transform:translateX(-12px)}100%{transform:translateX(14px)}}
.gc-snap{transform-box:fill-box;transform-origin:center;opacity:0;animation:gcSnap 2.4s ease-out infinite}
@keyframes gcSnap{0%,50%{opacity:0;transform:scale(.4)}58%{opacity:1;transform:scale(1.6)}75%,100%{opacity:0;transform:scale(2.2)}}
.gc-hb{animation:gcHb 1.2s ease-in-out infinite}
@keyframes gcHb{50%{opacity:.2}}
.gc-drop{animation:gcDrop 2.6s ease-in-out infinite}
@keyframes gcDrop{50%{transform:translateY(-3px)}}
.gc-oil0{animation:gcO0 3s ease-in-out infinite}.gc-oil1{animation:gcO1 3s ease-in-out infinite}.gc-oil2{animation:gcO2 3s ease-in-out infinite}.gc-oil3{animation:gcO3 3s ease-in-out infinite}
@keyframes gcO0{0%,10%,100%{transform:translate(-26px,-16px)}50%,80%{transform:none}}
@keyframes gcO1{0%,10%,100%{transform:translate(26px,-16px)}50%,80%{transform:none}}
@keyframes gcO2{0%,10%,100%{transform:translate(-26px,16px)}50%,80%{transform:none}}
@keyframes gcO3{0%,10%,100%{transform:translate(26px,16px)}50%,80%{transform:none}}
.gc-shackle{animation:gcLock 2.4s ease-in-out infinite}
@keyframes gcLock{0%,20%{transform:translateY(-7px)}45%,90%{transform:none}100%{transform:translateY(-7px)}}

/* enigma decoder */
.pill.secret{background:#C8423D;color:#FFFFFF;border-color:#C8423D;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem}
.esteps{display:flex;gap:6px;flex-wrap:wrap}
.esteps span{font-size:.8rem;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);transition:background .3s,color .3s}
.esteps span.cur{background:var(--carolina);color:var(--on-accent)}
.esteps span.done{background:var(--good-bg);color:var(--good)}
.intercept{display:flex;gap:16px;align-items:center;background:#0E1A2B;border-radius:16px;padding:14px;color:#CFE6F5;box-shadow:inset 0 0 0 2px #1E3A2E}
.intercept .radar{width:96px;height:96px;flex:none}
.radar .sweep{transform-origin:60px 60px;animation:sweep 2.2s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar .blip{animation:blip 1.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.15}50%{opacity:1}}
.intercept .ttl{font-family:var(--font-mono);font-weight:700;font-size:.9rem;color:#7CFFB8;display:flex;gap:8px;align-items:center;letter-spacing:.06em}
.intercept .ttl .dot{width:10px;height:10px;border-radius:50%;background:#FF5A5A;animation:blip 1s infinite}
.intercept .elab{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:#8FB3CC;margin-top:8px}
.intercept .strand{padding:6px 2px}
.intercept .base.empty{background:transparent;border-color:#3A5675;color:#5E7A96}
.intercept .base.empty.cur{border-color:#7CFFB8;box-shadow:0 0 0 3px rgba(124,255,184,.35)}
.base.type-in{animation:typeIn .25s ease-out}
@keyframes typeIn{0%{transform:translateY(-10px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.base.flip-in{animation:slotIn .45s cubic-bezier(.3,1.6,.5,1)}
.intercept .base.pick{cursor:pointer}
.intercept .base.pick:hover{transform:translateY(-3px)}
.intercept .base.lead{opacity:.35}
.intercept .base.glow{box-shadow:0 0 0 3px #7CFFB8,0 0 16px #7CFFB8;animation:glowPulse 1.2s ease-in-out 2}
@keyframes glowPulse{50%{box-shadow:0 0 0 5px #7CFFB8,0 0 26px #7CFFB8}}
.intercept .base.cgap{margin-right:10px}
.intercept .base.in{outline:3px solid #FFFFFF;outline-offset:1px}
.intercept .base.past{filter:saturate(.35) brightness(.85)}
.rotor-wrap{position:relative;margin:14px 0 4px}
.rotor span{transition:transform .2s}
.rotor span.landed{animation:pop .35s;background:#1B3A5C}
.rotor span.spinning{filter:blur(.6px);transform:translateY(-2px)}
.rotor span.final{background:var(--carolina);color:#FFFFFF;animation:bannerDance .7s ease both}
.flyer.big{width:44px;height:52px;font-size:1.6rem;border-radius:10px;font-family:var(--font-mono)}
.codon-table td button.hit{background:var(--good);color:#FFFFFF}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:5px solid #C8423D;color:#C8423D;font-family:var(--font-display);font-weight:800;font-size:clamp(1.4rem,4vw,2.4rem);letter-spacing:.12em;text-transform:uppercase;padding:2px 16px;border-radius:10px;background:transparent;animation:stampIn .55s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
@keyframes stampIn{0%{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.92}}

/* =================== HOME v3: hero band · welcome card · level trail =================== */
:root{--ink0:var(--ink);--ink20:var(--ink-2);--surface0:var(--surface);--line0:var(--line)}
.home{padding-top:14px}
.kicker{margin:0 0 4px;font:800 .74rem/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--carolina-deep)}
/* hero band */
.hero-band{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;padding:20px clamp(18px,4vw,40px) 92px;
  background:radial-gradient(120% 90% at 85% 0%,#2E78B5 0%,rgba(46,120,181,0) 55%),linear-gradient(160deg,#102443 0%,#173A66 55%,#1F5288 100%);
  --ink:#EAF3FB;--ink-2:#AFCBE4;--line:rgba(255,255,255,.18);color:var(--ink);box-shadow:0 18px 50px rgba(16,36,67,.28)}
.hero-band::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.12) 1.2px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.hero-band::after{content:"";position:absolute;z-index:-1;width:520px;height:520px;right:-160px;bottom:-300px;border-radius:50%;background:radial-gradient(circle,rgba(242,199,68,.22),transparent 65%);pointer-events:none}
.hb-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hb-chip{font:700 .78rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#CFE3F4;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.hero-band .btn.ghost{background:rgba(255,255,255,.08);color:#FFFFFF;border-color:rgba(255,255,255,.3)}
.hero-band .btn.ghost:hover{background:rgba(255,255,255,.16)}
.hero-band .btn.ghost svg *{stroke:#FFFFFF!important}
.hero-band .title-row{justify-content:center;margin-top:14px}
.hero-band .title-mustang{filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.hero-band .fr-mustang{fill:#8FCBF2!important;stroke:#8FCBF2!important}
.hero-band .fr-mustang-edge{fill:#0C1F3A!important;stroke:#0C1F3A!important}
.hero-band .fr-rush text{stroke:#0C1F3A!important}
.hero-band #frBeads circle{stroke:#0C1F3A!important}
.hero-band .subtitle{color:#CFE3F4}
.hero-band .subtitle em{color:#F2C744}
.hb-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,36px);align-items:center;margin-top:26px}
.hb-std .kicker{color:#F2C744}
.hb-quote{margin:0;font:600 clamp(1.08rem,1.7vw,1.3rem)/1.42 var(--font-display);color:#FFFFFF;letter-spacing:-.005em;text-wrap:pretty}
.hb-quote b{font-weight:800;color:#9FD3F5}
.hb-hint{margin:12px 0 0;font-size:.92rem;color:var(--ink-2)}
.dogma-card{margin:0;--ink:var(--ink0);--ink-2:var(--ink20);--line:var(--line0);background:var(--surface0);border-radius:20px;padding:12px 14px 8px;box-shadow:0 14px 34px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.4)}
.dogma-card svg{display:block;width:100%;height:auto}
/* welcome card */
.welcome{position:relative;z-index:2;margin:-62px clamp(10px,3vw,40px) 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.6vw,28px);box-shadow:0 2px 0 rgba(19,41,75,.04),0 22px 48px rgba(19,41,75,.16);display:grid;gap:clamp(16px,2.6vw,32px);align-items:center}
.welcome h2{font-size:clamp(1.3rem,2.4vw,1.7rem);letter-spacing:-.02em}
.welcome.first{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.welcome.back{grid-template-columns:auto minmax(0,1fr) minmax(180px,240px)}
.w-name{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.w-name input{flex:1 1 220px;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1.05rem;transition:border-color .15s,box-shadow .15s}
.w-name input:focus{outline:none;border-color:var(--carolina);box-shadow:0 0 0 4px color-mix(in srgb,var(--carolina) 25%,transparent)}
.w-name .btn:not(.small){padding:12px 20px;font-size:1.02rem}
.w-note{margin:10px 0 0;font-size:.85rem;color:var(--ink-2)}
.w-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.w-steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.w-steps b{display:block;font-family:var(--font-display);font-size:1.02rem}
.w-steps li span:not(.w-num){font-size:.88rem;color:var(--ink-2);line-height:1.35}
.w-num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 1.15rem var(--font-display);background:var(--carolina);color:var(--on-accent)}
.w-steps li:nth-child(2) .w-num{background:var(--carolina-deep)}
.w-steps li:nth-child(3) .w-num{background:#E3A21A;color:#13294B}
.w-ring{position:relative;width:104px;height:104px}
.w-ring-n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.w-ring-n b{font:800 2rem var(--font-display)}
.w-ring-n span{font-size:.78rem;color:var(--ink-2);font-weight:700;margin-top:2px}
.ring .ring-bg{fill:none;stroke:var(--surface-3)}
.ring .ring-fg{fill:none;stroke:var(--acc,var(--carolina));stroke-linecap:round;stroke-dashoffset:var(--off);transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.w-sub{margin:6px 0 0;color:var(--ink-2)}
.w-sub b{color:var(--ink)}
.w-acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.btn.big{padding:12px 22px;font-size:1.05rem;border-radius:12px}
.btn.big svg{transition:transform .2s}
.btn.big:hover svg{transform:translateX(3px)}
.linkbtn{background:none;border:0;padding:4px 0;font-size:.88rem;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.w-levels{display:grid;gap:10px;padding-left:clamp(0px,2vw,24px);border-left:1px solid var(--line)}
.w-lv{display:grid;grid-template-columns:62px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.w-lv i{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.w-lv i b{display:block;height:100%;border-radius:inherit;background:var(--acc)}
.w-lv em{font-style:normal;text-align:right;color:var(--ink)}
/* level accents */
.lv1{--acc:#4B9CD3;--acc-ink:#FFFFFF}
.lv2{--acc:#24679F;--acc-ink:#FFFFFF}
.lv3{--acc:#E3A21A;--acc-ink:#13294B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv2{--acc:#7FBCE8;--acc-ink:#0D1828}}
:root[data-theme="dark"] .lv2{--acc:#7FBCE8;--acc-ink:#0D1828}
/* trail */
.trail{margin-top:clamp(30px,4vw,48px)}
.tl{display:grid;grid-template-columns:60px minmax(0,1fr);gap:clamp(12px,2vw,24px)}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::after{content:"";position:absolute;top:66px;bottom:-6px;left:50%;border-left:3px dashed var(--line);transform:translateX(-50%)}
.tl:last-child .tl-rail::after{display:none}
.tl-badge{position:relative;width:60px;height:60px;display:grid;place-items:center;flex:none}
.tl-badge .ring{position:absolute;inset:0}
.tl-badge>span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font:800 1.35rem var(--font-display);box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 40%,transparent)}
.tl-badge>span svg{width:24px;height:24px}
.tl-body{padding-bottom:clamp(28px,4vw,44px);min-width:0}
.tl-head{margin:8px 0 14px}
.tl-kick{display:flex;justify-content:space-between;align-items:center;gap:6px 20px;flex-wrap:wrap;margin-bottom:4px}
.tl-kick .kicker{margin:0}
.tl-head .kicker{color:var(--acc)}
:root:not([data-theme="dark"]) .lv3 .tl-head .kicker{color:#A87300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv3 .tl-head .kicker{color:#F2C744}}
.tl-head h2{font-size:clamp(1.12rem,1.9vw,1.38rem);font-weight:700;max-width:68ch;letter-spacing:-.015em;text-wrap:pretty}
.tl-add{color:var(--ink-2);font-weight:600}
.tl-prog{display:grid;grid-template-columns:120px auto;gap:10px;align-items:center;font-size:.85rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tl-prog i{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.tl-prog i b{display:block;height:100%;background:var(--acc);border-radius:inherit}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:left;padding:16px 16px 0;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 0 rgba(19,41,75,.04);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.gcard::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--acc);opacity:0;transition:opacity .18s}
.gcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(19,41,75,.14);border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.gcard:hover::before,.gcard.up::before{opacity:1}
.gcard.up{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.gc-top{display:flex;align-items:center;gap:12px}
.gcard .ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,var(--surface))}
.gcard .ic svg{width:32px;height:32px}
.gcard h3{font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.gcard p{margin:0;font-size:.88rem;line-height:1.4;color:var(--ink-2);flex:1}
.gc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -16px;padding:10px 16px;border-top:1px solid var(--line);font-size:.8rem;font-weight:700}
.gc-best{padding:2px 9px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.gc-up{padding:2px 9px;border-radius:999px;background:var(--acc);color:var(--acc-ink)}
.gc-new{color:var(--ink-2);font-weight:600}
.gc-play{color:var(--ink);display:inline-flex;gap:4px}
.gc-play span{display:inline-block;transition:transform .18s}
.gcard:hover .gc-play span{transform:translateX(4px)}
.home-foot{display:flex;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-2)}
/* dark adjustments */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-band{background:radial-gradient(120% 90% at 85% 0%,#25609A 0%,rgba(37,96,154,0) 55%),linear-gradient(160deg,#0B1A30 0%,#122C4E 55%,#183F69 100%);border:1px solid rgba(255,255,255,.08)}
  :root:not([data-theme="light"]) .welcome{box-shadow:0 22px 48px rgba(0,0,0,.45)}}
:root[data-theme="dark"] .hero-band{background:radial-gradient(120% 90% at 85% 0%,#25609A 0%,rgba(37,96,154,0) 55%),linear-gradient(160deg,#0B1A30 0%,#122C4E 55%,#183F69 100%);border:1px solid rgba(255,255,255,.08)}
:root[data-theme="dark"] .welcome{box-shadow:0 22px 48px rgba(0,0,0,.45)}
/* intro choreography (first view only) */
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.ev-table2 td.g{font-weight:700;width:42%}
.ev-table2 td.b{width:34%}.ev-table2 td.b>*{vertical-align:middle}
.ev-table2 td.b .bar{display:inline-block;width:calc(100% - 52px);min-width:50px;margin-right:8px}
.ev-table2 .bar i{background:var(--acc)}
.ev-table2 td.p,.ev-table2 td.w{white-space:nowrap;font-size:.85rem}
.ev-tip{margin:14px 0 0;font-size:.88rem;color:var(--ink-2)}
.ev-outcome{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:color-mix(in srgb,#F2C744 16%,var(--surface));border:1px solid color-mix(in srgb,#E3A21A 45%,var(--line))}
.ev-oc-ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface)}
.ev-outcome p{margin:4px 0 0;font-size:.92rem;color:var(--ink-2)}
.ev-prompt{margin:14px 0 10px}
.ev-starters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.ev-starters>span{font-size:.82rem;font-weight:700;color:var(--ink-2);margin-right:4px}
.ev-chip{border:1px dashed var(--carolina);background:var(--sky-soft);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:700}
.ev-chip:hover{border-style:solid}
.ev-card textarea{width:100%;resize:vertical;min-height:170px;line-height:1.5;font-family:var(--font-body)}
.ev-wc{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.ev-wc .bar{flex:1;max-width:260px}
.ev-wc .bar i{transition:width .25s,background .25s;background:#E3A21A}
.ev-wc .bar i.done{background:var(--good)}
.ev-check{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.ev-check li{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink-2)}
.ev-check li span{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.ev-check li.ok{color:var(--ink)}
.ev-check li.ok span{background:var(--good);border-color:var(--good);color:#FFFFFF}
.ev-check li.ok span svg{width:14px;height:14px}
.ev-dl{display:flex;gap:10px;flex-wrap:wrap}
.ev-dl .btn svg *{stroke:currentColor!important}
.ev-dl .btn.alt{background:var(--carolina-deep);box-shadow:0 2px 0 #13294B}
.ev-dl .btn[disabled]{opacity:.4}
.ev-dl .btn.busy{opacity:.7;cursor:progress}
.ev-note{margin:10px 0 0;font-size:.9rem;color:var(--ink-2)}
.ev-more{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ev-side{position:sticky;top:14px}
.ev-prev{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:16px}
.ev-paper{border-radius:8px;overflow:hidden;background:#FFFFFF;box-shadow:0 10px 30px rgba(19,41,75,.18);min-height:240px}
.ev-paper img{display:block;width:100%;height:auto}
.ev-prev .muted{font-size:.82rem;margin:10px 0 0}
@media (max-width:900px){.ev-grid{grid-template-columns:minmax(0,1fr)}.ev-side{position:static}.ev-prev{max-width:420px;margin:0 auto}.ev-hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.ev-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.ev-table2 td.w{display:none}.ev-table2 td.g{width:auto}}

/* sticky game bar: Menu always reachable */
.gbar{position:sticky;top:0;z-index:40;flex-wrap:nowrap;margin-inline:-16px;padding:12px 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 1px 0 color-mix(in srgb,var(--line) 70%,transparent);margin-bottom:10px}
.gbar h1{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .btn{flex:none}
.gbar .btn svg{flex:none}
.gbar .top-actions{flex-wrap:nowrap}
.gbar .pill{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.gbar .lvl,.gbar .pill{display:none}.gbar h1{font-size:1.15rem}}
@media (max-width:520px){.gbar .lbl{display:none}.gbar{gap:8px}}
.howto{margin-top:4px}
/* Dogma Invaders pause/settings panel */
.inv-panel{display:grid;justify-items:center;gap:14px;max-width:min(520px,94%);padding:22px 18px;border-radius:18px;background:rgba(5,10,24,.9);border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.inv-panel .inv-tog{pointer-events:auto}
.inv-panel .inv-tog svg{width:16px;height:16px}
.inv-pnote{margin:0;font-size:.85rem;color:#AFC6E6;max-width:40ch}

/* Pin the Tail: animated blindfold intro */
#marty .m-fade{transition:opacity .6s ease}
#marty .m-tail{transform-box:fill-box;transform-origin:20% 10%;transition:transform 1.1s cubic-bezier(.55,0,.85,.35),opacity .9s ease .5s}
#marty .m-tail.drop{transform:translate(30px,520px) rotate(38deg);opacity:0}
.pin-introrow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;min-height:54px}
.pin-intro{position:relative;display:flex;align-items:center;gap:12px;max-width:94%;padding:10px 16px 10px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:1.02rem;box-shadow:0 10px 26px rgba(19,41,75,.3);pointer-events:none;transition:opacity .3s}
.pin-intro:empty,.pin-intro.gone{opacity:0}
.pin-intro.swap{animation:piSwap .45s cubic-bezier(.2,.8,.2,1)}
@keyframes piSwap{from{opacity:0;transform:translateY(10px) scale(.96)}}
.pi-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--g1);color:#13294B}
.pi-ic svg{width:20px;height:20px}
.pi-t{min-width:0}
.pi-dots{display:flex;gap:5px;flex:none}
.pi-dots i{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--bg) 30%,transparent);transition:background .3s}
.pi-dots i.on{background:var(--g1)}
.pin-skip{position:absolute;top:10px;right:10px;z-index:4}
.blindfold{position:absolute;inset:0;z-index:2;display:grid;place-items:center;transform:translateY(-102%);transition:transform .75s cubic-bezier(.65,0,.3,1);pointer-events:none;
  background:repeating-linear-gradient(135deg,#13294B 0 14px,#17305A 14px 28px);box-shadow:inset 0 -10px 0 #F2C744}
.blindfold.on{transform:none}
.blindfold.off{transform:translateY(102%);box-shadow:inset 0 10px 0 #F2C744}
.blindfold>div{display:grid;justify-items:center;gap:6px;color:#FFFFFF;text-align:center}
.blindfold b{font:800 clamp(1.4rem,4vw,2.2rem) var(--font-display);color:#F2C744}
.blindfold span{color:#CFE3F4;font-weight:700}
.pin-prompt .n svg{width:26px;height:26px;display:block}
@media (max-width:560px){.pin-intro{font-size:.88rem;padding:8px 14px 8px 8px;gap:10px;border-radius:18px}.pi-ic{width:28px;height:28px}.pi-dots{display:none}}

</style>
</head>

const STORE_KEY = 'codonRodeo.v1';

  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { } }
};
store.load();
function record(id, correct, total, note) {
  const pct = total ? Math.round(100 * correct / total) : 0;
  const g = store.data.games[id] || { best: 0, plays: 0 };
  g.plays++; g.last = pct; g.best = Math.max(g.best, pct); g.when = new Date().toLocaleString();
  if (note) g.note = note;
  store.data.games[id] = g; store.save();
  return pct;
}

function confetti(n = 120) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let c = $('#confetti'); if (!c) { c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c); }
  const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#4B9CD3', '#A9D4F2', '#FFFFFF', '#13294B', '#E2628C', '#3E9E66', '#E3B021'];
  const ps = Array.from({ length: n }, () => ({ x: c.width / 2 + (Math.random() - .5) * 200, y: c.height * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, col: pick(cols), life: 0 }));
  let f = 0;
  (function step() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .4; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.strokeStyle = '#13294B33'; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.strokeRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 140) requestAnimationFrame(step); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
