/* ---------- registry, router, shell ---------- */
const GAMES = [];
const reg = g => GAMES.push(g);
let leaveFns = [];
const onLeave = fn => leaveFns.push(fn);
const app = () => $('#app');

function topActions() { return `<span class="top-actions">${store.data.name ? `<span class="pill">${esc(store.data.name)}</span>` : ''}<button class="btn ghost small" data-go="evidence" aria-label="My Evidence">${icon('evidence', 18)}<span class="lbl">My Evidence</span></button></span>`; }
const restartIcon = `<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4.5 9.5a5.5 5.5 0 1 0 1.8-4.1M4 3v4h4" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/></svg>`;
function topbar() { return `<header class="topbar home-top">${topActions()}</header>`; }
function shell(g) {
  app().innerHTML = `<div class="wrap">
    <div class="gbar"><button class="btn ghost small" data-home aria-label="Back to main menu">${chev}<span>Menu</span></button><span class="lvl">Level ${g.level}</span><h1>${g.title}</h1><span class="spacer"></span><button class="btn ghost small" data-restart aria-label="Start this game over" title="Start this game over">${restartIcon}<span class="lbl">Start over</span></button>${topActions()}</div>
    <p class="howto">${g.how}</p><div class="arena" id="arena"></div></div>`;
  return $('#arena');
}
let current = null;
function go(id) {
  current = id || '';
  try { if (location.hash.replace('#', '') !== current) history.replaceState(null, '', current ? '#' + current : location.pathname + location.search); } catch (e) { }
  route(current);
}
function route(forced) {
  leaveFns.forEach(f => { try { f(); } catch (e) { } }); leaveFns = [];
  let id = typeof forced === 'string' ? forced : '';
  if (typeof forced !== 'string') { try { id = location.hash.replace('#', ''); } catch (e) { } }
  current = id;
  const g = GAMES.find(x => x.id === id);
  window.scrollTo(0, 0);
  if (id === 'evidence') return renderEvidence();
  if (!g) return renderHome();
  const arena = shell(g);
  g.run(arena, g);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-home],[data-restart]'); if (!t) return;
  e.preventDefault(); if (t.hasAttribute('data-restart')) return route(current); go(t.hasAttribute('data-home') ? '' : t.dataset.go);
});
addEventListener('hashchange', () => { let h = ''; try { h = location.hash.replace('#', ''); } catch (e) { } if (h !== current) route(h); });

/* end-of-round panel */
function finishPanel(arena, g, correct, total, msg, again) {
  const pct = record(g.id, correct, total);
  if (pct >= 80) confetti();
  arena.innerHTML = `<div class="done-card"><h2>${pct >= 80 ? 'Yee-haw! Round complete' : pct >= 50 ? 'Nice ride. Keep practicing' : 'Saddle up for another round'}</h2>
    <div class="big">${correct} / ${total}</div><p class="muted">${msg || ''}</p><p class="muted">Best on this game: ${store.data.games[g.id].best}%</p>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="again">Play again</button><button class="btn ghost" data-home>Back to menu</button></div></div>`;
  $('#again', arena).onclick = again;
}

/* ---------- drag + tap-to-place ---------- */
/* Any element with [data-drag] can be dragged (pointer) or tapped to select; any [data-drop] receives it. */
function DnD(root, onDropFn) {
  if (root._dnd) { root._dnd.cb = onDropFn; root._dnd.api.clearSel(); return root._dnd.api; }
  const state = { cb: onDropFn }; const onDrop = (a, b) => state.cb(a, b);
  let sel = null, drag = null;
  const clearSel = () => { if (sel) sel.classList.remove('sel'); sel = null; };
  const down = e => {
    const el = e.target.closest('[data-drag]'); if (!el || !root.contains(el) || el.classList.contains('used')) return;
    drag = { el, x: e.clientX, y: e.clientY, moved: false, ghost: null, hot: null };
    el.setPointerCapture?.(e.pointerId);
  };
  const move = e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
      drag.moved = true; const g = drag.el.cloneNode(true); g.classList.add('drag-ghost'); g.classList.remove('sel'); document.body.appendChild(g); drag.ghost = g; drag.el.style.opacity = '.35';
    }
    if (drag.moved) {
      e.preventDefault();
      drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
      const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
      if (drag.hot !== t) { drag.hot?.classList.remove('drop-hot'); t?.classList.add('drop-hot'); drag.hot = t; }
    }
  };
  const up = e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) {
      d.ghost.remove(); d.el.style.opacity = ''; d.hot?.classList.remove('drop-hot');
      const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop]');
      clearSel();
      if (t && root.contains(t)) onDrop(d.el, t);
    } else {
      // tap: select / or if tapping a chip already placed inside a drop zone with a selection, place there
      if (sel === d.el) { clearSel(); return; }
      const home = d.el.closest('[data-drop]'), bankEl = root.querySelector('[data-drop="bank"]');
      if (sel && home && home !== sel.closest('[data-drop]')) { const s = sel; clearSel(); onDrop(s, home); return; }
      if (!sel && home && home.dataset.drop !== 'bank' && bankEl) { onDrop(d.el, bankEl); return; }
      clearSel(); sel = d.el; sel.classList.add('sel');
    }
  };
  const click = e => {
    if (e.target.closest('[data-drag]')) return;
    const t = e.target.closest('[data-drop]');
    if (t && sel && root.contains(t)) { const s = sel; clearSel(); onDrop(s, t); }
  };
  root.addEventListener('pointerdown', down);
  addEventListener('pointermove', move, { passive: false });
  addEventListener('pointerup', up);
  root.addEventListener('click', click);
  onLeave(() => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); root._dnd = null; });
  const api = { clearSel }; root._dnd = { state, api, get cb() { return state.cb; }, set cb(f) { state.cb = f; } };
  return api;
}

/* ---------- label-the-diagram component ---------- */
/* zones: [{id,label,x,y,px,py}] in viewBox coords. x,y = drop box center, px,py = point the leader line touches */
function labelDiagram(host, { svg, vb, zones, distractors = [], onCheck, watch, finale, restore, decoyNotes = {} }) {
  const [W, H] = vb;
  host.innerHTML = `
    ${watch ? `<div class="row" style="margin-bottom:10px"><button class="btn ghost small" id="watchBtn">Watch it happen</button><span class="muted" id="watchNote" style="font-size:.9rem">Press to see the animation, then label the frozen diagram.</span></div>` : ''}
    <div class="diagram" id="dg">${svg}</div>
    <div class="caption-bar" id="cap" hidden aria-live="polite"></div>
    <p class="muted" style="font-size:.9rem;margin:10px 0 6px">Drag each label to a dashed box, or tap a label and then tap a box. Tap a placed label to send it back.</p>
    <div class="bank" id="bank" data-drop="bank"></div>
    <div class="feedback" id="fb"></div>
    <div class="row"><button class="btn ghost" id="chk">Show wrong labels</button><button class="btn ghost" id="reset">Reset</button></div>`;
  const dg = $('#dg', host), bank = $('#bank', host), svgEl = $('svg', dg);
  // leaders
  const lead = svgEl.querySelector('#leaders') || (() => { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.id = 'leaders'; svgEl.appendChild(g); return g; })();
  lead.innerHTML = zones.map(z => `<line x1="${z.x}" y1="${z.y}" x2="${z.px}" y2="${z.py}" style="stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3"/><circle cx="${z.px}" cy="${z.py}" r="5" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>`).join('');
  zones.forEach((z, i) => {
    const d = document.createElement('div'); d.className = 'dz'; d.dataset.drop = z.id; d.dataset.zone = z.id;
    d.style.left = (100 * z.x / W) + '%'; d.style.top = (100 * z.y / H) + '%';
    d.innerHTML = `<span class="dz-num">${i + 1}</span><span class="ph">?</span>`; dg.appendChild(d);
  });
  const labels = shuffle([...zones.map(z => z.label), ...distractors]);
  bank.innerHTML = labels.map(l => `<span class="chip" data-drag data-label="${esc(l)}">${esc(l)}</span>`).join('');
  let first = true, firstScore = null;
  const fb = $('#fb', host);
  DnD(host, (chip, target) => {
    $$('.dz', dg).forEach(z => z.classList.remove('ok', 'no'));
    if (target.dataset.drop !== 'bank' && decoyNotes[chip.dataset.label]) { bank.appendChild(chip); bump(chip); fb.className = 'feedback no'; fb.textContent = decoyNotes[chip.dataset.label]; return; }
    if (target.dataset.drop === 'bank') { bank.appendChild(chip); }
    else {
      const ex = target.querySelector('.chip'); if (ex && ex !== chip) bank.appendChild(ex);
      target.querySelector('.ph')?.remove(); target.appendChild(chip); target.classList.add('filled');
    }
    $$('.dz', dg).forEach(z => { if (!z.querySelector('.chip')) { z.classList.remove('filled'); if (!z.querySelector('.ph')) z.insertAdjacentHTML('beforeend', '<span class="ph">?</span>'); } });
    fb.textContent = '';
    autoCheck();
  });
  let solved = false;
  const zoneChip = z => $(`[data-zone="${z.id}"] .chip`, dg);
  function autoCheck() {
    if (solved || !zones.every(zoneChip)) return;
    const ok = zones.filter(z => zoneChip(z).dataset.label === z.label).length;
    if (first) { firstScore = ok; first = false; }
    if (ok === zones.length) return succeed();
    fb.className = 'feedback no'; fb.textContent = 'Every box is filled, but some labels are in the wrong spot. Swap some, or press "Show wrong labels."';
  }
  function succeed() {
    solved = true;
    zones.forEach(z => $(`[data-zone="${z.id}"]`, dg).classList.add('ok'));
    $$('.chip', host).forEach(c => c.removeAttribute('data-drag'));
    fb.className = 'feedback ok'; fb.textContent = `All ${zones.length} labels correct!`;
    if (!finale) { bank.style.display = 'none'; const tip = host.querySelector('p.muted'); if (tip) tip.style.display = 'none'; const r = $('.row', host); if (r) r.style.display = 'none'; }
    onCheck && onCheck(firstScore ?? zones.length, zones.length);
    if (finale) setTimeout(runFinale, 500); else confetti();
  }
  $('#chk', host).onclick = () => {
    if (solved) return;
    let ok = 0;
    zones.forEach(z => { const el = $(`[data-zone="${z.id}"]`, dg); const c = el.querySelector('.chip'); const good = c && c.dataset.label === z.label; el.classList.toggle('ok', !!good); el.classList.toggle('no', !good); if (good) ok++; });
    fb.className = 'feedback ' + (ok === zones.length ? 'ok' : 'no');
    fb.textContent = ok === zones.length ? `All ${ok} labels correct!` : `${ok} of ${zones.length} correct. Red boxes need another look.`;
    if (ok === zones.length) succeed();
  };
  let running = false;
  async function runFinale() {
    if (running) return; running = true;
    const cap = $('#cap', host), row = $('.row', host);
    const token = { cancel: false }; onLeave(() => token.cancel = true);
    $$('.dz', dg).forEach(z => z.style.visibility = 'hidden'); lead.style.visibility = 'hidden';
    bank.style.display = 'none'; host.querySelector('p.muted').style.display = 'none'; row.style.display = 'none';
    fb.className = 'feedback ok'; fb.textContent = 'All labels correct! Watch it happen...';
    dg.scrollIntoView({ behavior: 'smooth', block: 'start' });
    await finale(svgEl, cap, token);
    if (token.cancel) return;
    running = false; confetti(90);
    fb.className = 'feedback ok'; fb.textContent = 'That is the whole process! Replay it as many times as you like.';
    row.style.display = ''; row.innerHTML = '<button class="btn" id="replay">Replay animation</button><button class="btn ghost" id="showLabels">Show my labels</button>';
    $('#replay', host).onclick = () => runFinale();
    $('#showLabels', host).onclick = () => { restore && restore(svgEl); $$('.dz', dg).forEach(z => z.style.visibility = ''); lead.style.visibility = ''; };
  }
  $('#reset', host).onclick = () => { $$('.dz .chip', dg).forEach(c => bank.appendChild(c)); $$('.dz', dg).forEach(z => { z.className = 'dz'; if (!z.querySelector('.ph')) z.insertAdjacentHTML('beforeend', '<span class="ph">?</span>'); }); fb.textContent = ''; };
  if (watch) {
    $('#watchBtn', host).onclick = async (e) => {
      const b = e.currentTarget; b.disabled = true; $$('.dz', dg).forEach(z => z.style.visibility = 'hidden'); lead.style.visibility = 'hidden';
      await watch(svgEl, $('#watchNote', host));
      $$('.dz', dg).forEach(z => z.style.visibility = ''); lead.style.visibility = ''; b.disabled = false; b.textContent = 'Watch again';
    };
  }
}

/* ---------- sortable list ---------- */
function sortable(ul, onChange) {
  let dragEl = null;
  ul.addEventListener('pointerdown', e => {
    const g = e.target.closest('.grip'); if (!g) return;
    dragEl = g.closest('.sortitem'); dragEl.classList.add('dragging'); e.preventDefault();
  });
  const mv = e => {
    if (!dragEl) return; e.preventDefault();
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.sortitem');
    if (over && over !== dragEl && over.parentNode === ul) {
      const r = over.getBoundingClientRect();
      ul.insertBefore(dragEl, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
      renumber();
    }
  };
  const upf = () => { if (dragEl) dragEl.classList.remove('dragging'); dragEl = null; };
  addEventListener('pointermove', mv, { passive: false }); addEventListener('pointerup', upf);
  onLeave(() => { removeEventListener('pointermove', mv); removeEventListener('pointerup', upf); });
  ul.addEventListener('click', e => {
    const b = e.target.closest('[data-mv]'); if (!b) return;
    const it = b.closest('.sortitem');
    if (b.dataset.mv === 'up' && it.previousElementSibling) ul.insertBefore(it, it.previousElementSibling);
    if (b.dataset.mv === 'dn' && it.nextElementSibling) ul.insertBefore(it.nextElementSibling, it);
    renumber();
  });
  function renumber() { $$('.sortitem', ul).forEach((li, i) => { li.querySelector('.num').textContent = i + 1; li.classList.remove('ok', 'no'); }); onChange && onChange(); }

    let cur = { r: L.placed[0].r, c: L.placed[0].c, dir: L.placed[0].dir }; const revealed = new Set(), solvedSet = new Set(); let finished = false;
    const nums = {}; L.placed.forEach(p => nums[p.r + ',' + p.c] = p.num);
    arena.innerHTML = `<div class="xprog" aria-hidden="true"><i id="xp" style="width:0%"></i></div>

      <div class="clues"><div class="panel" id="curClue" style="margin-bottom:10px;font-weight:700;min-height:3em"></div><h3>Across</h3><ol id="ca"></ol><h3>Down</h3><ol id="cd"></ol></div></div>
      <div class="feedback" id="fb"></div><div class="row"><button class="btn ghost" id="chk">Show mistakes</button><button class="btn ghost" id="rev">Reveal this word</button><button class="btn ghost" id="new">New puzzle</button></div>`;
    const clueLi = (p, i) => `<li data-p="${i}"><b>${p.num}.</b> ${p.clue} <span class="muted">(${p.w.length})</span></li>`;
    $('#ca', arena).innerHTML = L.placed.map((p, i) => p.dir === 'A' ? clueLi(p, i) : '').join('');
    $('#cd', arena).innerHTML = L.placed.map((p, i) => p.dir === 'D' ? clueLi(p, i) : '').join('');
    const cellEl = (r, c) => $(`.xc[data-r="${r}"][data-c="${c}"]`, arena);
    const cellsOf = p => Array.from({ length: p.w.length }, (_, i) => cellEl(p.r + (p.dir === 'D' ? i : 0), p.c + (p.dir === 'A' ? i : 0)));
    const curWord = () => { const cell = grid[cur.r][cur.c]; let wi = cell.words.find(i => L.placed[i].dir === cur.dir); if (wi == null) { wi = cell.words[0]; cur.dir = L.placed[wi].dir; } return wi; };
    function paint() {
      $$('.xc.on', arena).forEach(e => e.classList.remove('hl', 'cur'));
      const wi = curWord(), p = L.placed[wi];
      cellsOf(p).forEach(c => c.classList.add('hl'));
      cellEl(cur.r, cur.c).classList.add('cur');
      $$('.clues li', arena).forEach(li => li.classList.toggle('act', +li.dataset.p === wi));
      $('#curClue', arena).innerHTML = solvedSet.has(wi) ? `${checkSVG} ${p.num} ${p.dir === 'A' ? 'Across' : 'Down'}: <span style="color:var(--good)">${p.w}</span>` : `${p.num} ${p.dir === 'A' ? 'Across' : 'Down'}: ${p.clue}`;

    }

    });

    const step = d => { const p = L.placed[curWord()]; const nr = cur.r + (p.dir === 'D' ? d : 0), nc = cur.c + (p.dir === 'A' ? d : 0); if (grid[nr] && grid[nr][nc]) { cur.r = nr; cur.c = nc; } };

    arena.addEventListener('keydown', e => {

      else if (e.key === 'Backspace') { e.preventDefault(); if (!inp.value) step(-1); cellEl(cur.r, cur.c).querySelector('input').value = ''; paint(); }
      else if (e.key.startsWith('Arrow')) { e.preventDefault(); const map = { ArrowRight: [0, 1, 'A'], ArrowLeft: [0, -1, 'A'], ArrowDown: [1, 0, 'D'], ArrowUp: [-1, 0, 'D'] }[e.key]; const nr = cur.r + map[0], nc = cur.c + map[1]; if (grid[nr] && grid[nr][nc]) { cur.r = nr; cur.c = nc; if (grid[nr][nc].words.some(i => L.placed[i].dir === map[2])) cur.dir = map[2]; } paint(); }
    });

      });

      if (!finished && solvedSet.size === L.placed.length) {
        finished = true; const earned = L.placed.length - revealed.size;
        $$('.xc.on', arena).forEach(c => { c.style.setProperty('--w', ((+c.dataset.r) + (+c.dataset.c)) * 45 + 'ms'); c.classList.remove('wave'); restart(c, 'cascade'); });

    $('#chk', arena).onclick = () => { let wrong = 0; $$('.xc.on', arena).forEach(c => { const v = c.querySelector('input').value; const ch = grid[+c.dataset.r][+c.dataset.c].ch; c.classList.remove('no'); if (v && v !== ch) { restart(c, 'no'); wrong++; } }); $('#fb', arena).className = 'feedback ' + (wrong ? 'no' : 'ok'); $('#fb', arena).textContent = wrong ? `${wrong} square${wrong > 1 ? 's are' : ' is'} wrong (shaking in red).` : 'Everything you have filled in so far is correct.'; };
    $('#rev', arena).onclick = () => { const wi = curWord(), p = L.placed[wi]; revealed.add(wi); cellsOf(p).forEach((c, i) => c.querySelector('input').value = p.w[i]); checkSolved(); paint(); };
    $('#new', arena).onclick = () => g.run(arena, g);
    setTimeout(paint, 50);
  }
});

/* ---------- ACROSTIC ---------- */
const ACRO_KEYS = [
  ['PROTEIN', 'Everything in this unit builds one: DNA → RNA → PROTEIN.'],
  ['CODONS', 'Three-base "words" on mRNA, each coding for one amino acid.'],
  ['RIBOSOME', 'The chef that reads mRNA and links amino acids together.'],
  ['SHAPE', 'A protein\'s shape determines its function!'],
  ['MUSTANGS', 'Every cell in a Mustang is making proteins right now.'],
  ['GENES', 'DNA recipes, each coding for one protein.']
];
reg({
  id: 'acrostic', level: 1, icon: 'acrostic', title: 'Acrostic Puzzle', blurb: 'Solve each row to launch a letter into the hidden word.',
  how: 'Each row is a core vocab term. Fill it in from its clue. When a row is right, its gold letter launches into the hidden word at the top.',
  run(arena, g) {
    let rows, kw, msg;
    for (let tries = 0; tries < 30; tries++) {
      [kw, msg] = pick(ACRO_KEYS); rows = []; const used = new Set(); let ok = true;
      for (const Lt of kw) {
        const cands = shuffle(VOCAB.filter(v => v.x.includes(Lt) && !used.has(v.x) && !kw.includes(v.x) && !v.x.includes(kw) && v.x.length <= 13));
        if (!cands.length) { ok = false; break; }
        const v = cands[0]; used.add(v.x); const idxs = [...v.x].map((c, i) => c === Lt ? i : -1).filter(i => i >= 0);
        rows.push({ w: v.x, clue: v.c, k: pick(idxs) });
      }
      if (ok) break;
    }
    const maxK = Math.max(...rows.map(r => r.k)); let hints = 0, solvedRows = 0;
    arena.innerHTML = `<p class="muted" style="margin:0;text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.1em">HIDDEN WORD</p><div class="banner" id="ban">${[...kw].map(() => '<span></span>').join('')}</div>
      <div class="clue-card" id="focusClue" style="margin-bottom:12px"><span class="tag">Row 1</span><span>${rows[0].clue}</span></div>
      <div class="acro" id="ac">${rows.map((r, ri) => `<div class="arow" data-r="${ri}" style="--d:${ri * 70}ms">${'<span class="acell"></span>'.repeat(maxK - r.k)}${[...r.w].map((_, i) => `<span class="acell ${i === r.k ? 'key' : ''}" style="--w:${i * 40}ms"><input maxlength="1" data-r="${ri}" data-i="${i}" aria-label="Row ${ri + 1} letter ${i + 1}" autocomplete="off"></span>`).join('')}<span class="aclue">${ri + 1}. ${r.clue} <span class="muted">(${r.w.length})</span></span></div>`).join('')}</div>
      <div class="feedback" id="fb"></div><div class="row"><button class="btn ghost" id="hint">Reveal a letter</button><button class="btn ghost" id="new">New puzzle</button></div>`;
    const ac = $('#ac', arena), fb = $('#fb', arena); let focusRow = 0;
    const rowInputs = ri => $$(`input[data-r="${ri}"]`, ac);
    ac.addEventListener('focusin', e => { const t = e.target.closest('input'); if (!t) return; focusRow = +t.dataset.r; $$('.arow', ac).forEach(r => r.classList.toggle('focus', +r.dataset.r === focusRow)); $('#focusClue', arena).innerHTML = `<span class="tag">Row ${focusRow + 1}</span><span>${rows[focusRow].clue}</span>`; });
    function checkRow(ri) {
      const ins = rowInputs(ri), r = rows[ri]; if (ins.some(i => !i.value)) return;
      const row = ins[0].closest('.arow'); if (row.classList.contains('locked')) return;
      if (ins.map(i => i.value).join('') === r.w) {
        row.classList.add('locked'); ins.forEach(i => i.readOnly = true); solvedRows++;
        const keyCell = ins[r.k], slot = $$('#ban span', arena)[ri];
        const a = keyCell.getBoundingClientRect(), b = slot.getBoundingClientRect();
        const fly = document.createElement('div'); fly.className = 'flyer'; fly.textContent = r.w[r.k]; fly.style.left = a.left + 'px'; fly.style.top = a.top + 'px'; document.body.appendChild(fly);
        const anim = fly.animate([{ transform: 'translate(0,0) scale(1) rotate(0)' }, { transform: `translate(${(b.left - a.left) / 2}px,${(b.top - a.top) / 2 - 60}px) scale(1.6) rotate(200deg)`, offset: .55 }, { transform: `translate(${b.left - a.left + 8}px,${b.top - a.top + 12}px) scale(1.2) rotate(360deg)` }], { duration: 900, easing: 'cubic-bezier(.4,0,.2,1)' });
        const land = () => { fly.remove(); slot.textContent = r.w[r.k]; slot.classList.add('got'); if (solvedRows === rows.length) done(); };
        anim.onfinish = land; anim.oncancel = land;
        fb.className = 'feedback ok'; fb.textContent = `${r.w} locked in!`;
        const next = rows.findIndex((_, i) => !rowInputs(i)[0].closest('.arow').classList.contains('locked')); if (next >= 0) rowInputs(next).find(i => !i.value)?.focus() || rowInputs(next)[0].focus();
      } else {
        restart(row, 'bad'); ins.forEach((inp, i) => { if (inp.value !== r.w[i]) { inp.parentElement.classList.add('no'); setTimeout(() => inp.parentElement.classList.remove('no'), 1400); } });
        fb.className = 'feedback no'; fb.textContent = 'Not quite. The red letters need another look.';
      }
    }
    function done() {
      const ban = $('#ban', arena); $$('span', ban).forEach((s, i) => s.style.setProperty('--d', i * 90 + 'ms')); ban.classList.add('done');
      confetti(); fb.className = 'feedback ok'; fb.textContent = `${kw}! ${msg}`;
      setTimeout(() => finishPanel(arena, g, Math.max(0, rows.length - hints), rows.length, `Hidden word: ${kw}. ${msg} (Score drops by one for each revealed letter.)`, () => g.run(arena, g)), 2600);
    }
    ac.addEventListener('input', e => { const t = e.target; if (t.readOnly) return; t.value = t.value.replace(/[^a-z]/gi, '').slice(-1).toUpperCase(); t.parentElement.classList.remove('no'); if (t.value) { restart(t.parentElement, 'pop'); const nx = $(`input[data-r="${t.dataset.r}"][data-i="${+t.dataset.i + 1}"]`, ac); if (nx) nx.focus(); checkRow(+t.dataset.r); } });
    ac.addEventListener('keydown', e => { const t = e.target; if (e.key === 'Backspace' && !t.value) $(`input[data-r="${t.dataset.r}"][data-i="${+t.dataset.i - 1}"]`, ac)?.focus(); if (e.key === 'ArrowDown' || e.key === 'Enter') $(`input[data-r="${+t.dataset.r + 1}"]`, ac)?.focus(); if (e.key === 'ArrowUp') $(`input[data-r="${+t.dataset.r - 1}"]`, ac)?.focus(); });
    $('#hint', arena).onclick = () => { const ins = rowInputs(focusRow); if (ins[0].readOnly) return; const r = rows[focusRow]; const i = ins.findIndex((inp, k) => inp.value !== r.w[k]); if (i < 0) return; ins[i].value = r.w[i]; restart(ins[i].parentElement, 'pop'); hints++; checkRow(focusRow); };
    $('#new', arena).onclick = () => g.run(arena, g);
    setTimeout(() => rowInputs(0)[0].focus({ preventScroll: true }), 600);
  }
});
